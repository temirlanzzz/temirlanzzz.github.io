t,#p-id{font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-size:10px}#p-name{letter-spacing:-.01em;margin:10px 0 6px;font-size:30px;font-weight:300;line-height:1.08}#p-price{font-family:var(--mono);color:var(--warm);font-size:18px}#p-desc{color:#f3efe8c7;margin:14px 0 18px;font-size:13.5px;line-height:1.55}.lbl{font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);justify-content:space-between;margin:14px 0 8px;font-size:10px;display:flex}#p-sw{gap:9px;display:flex}.sw{background:var(--c);outline-offset:3px;border:0;border-radius:50%;outline:1px solid #0000;width:28px;height:28px;transition:outline-color .2s;box-shadow:inset 0 0 0 1px #fff3}.sw.on{outline-color:var(--ink)}#p-size{grid-template-columns:repeat(5,1fr);gap:6px;display:grid}#p-size button{border:1px solid var(--line);font-family:var(--mono);background:0 0;border-radius:8px;padding:8px 0;font-size:12px}#p-size button.on{background:var(--ink);color:#111;border-color:var(--ink)}.acts{grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;display:grid}.acts button{border:1px solid var(--line);background:#ffffff0f;border-radius:10px;padding:12px 10px;font-size:13px}.acts button.on{border-color:var(--warm);color:var(--warm)}#p-try{color:#111;grid-column:1/-1;font-weight:600;background:var(--ink)!important}#p-add{color:#111;grid-column:1/-1;font-weight:700;background:linear-gradient(90deg,#ffcf9a,#ffb36b)!important;border:0!important}#p-close{z-index:4;opacity:0;pointer-events:none;transition:opacity .4s .3s;position:fixed;top:18px;left:22px}body.in-studio #p-close{opacity:1;pointer-events:auto}#studio-hint{z-index:3;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);opacity:0;pointer-events:none;white-space:nowrap;font-size:10px;transition:opacity .4s .6s;position:fixed;bottom:22px;left:50%;transform:translate(-50%)}body.in-studio #studio-hint{opacity:1}.fly{z-index:9;pointer-events:none;border-radiu </head>
<body>
<canvas id="scene" aria-label="ATRIUM: four towers of lit display windows, viewed from the centre of their courtyard"></canvas>

<div id="loader"><div><b>ATRIUM</b><div id="load-track"><div id="load-bar"></div></div><div id="load-label">loading</div></div></div>

<div id="title"><div><h1>ATRIUM</h1><p>Fall into the collection</p></div></div>

<div class="hud fall-only" id="brand"><b>ATRIUM</b><span>Four towers · one endless collection</span></div>
<div class="hud" id="top-r">
  <button class="chip fall-only" id="flip">Look up ↑</button>
  <span class="chip" id="bag">Bag <i id="bag-n">0</i></span>
</div>
<div class="hud fall-only" id="meter">
  <small>Level</small>
  <div id="depth">−0000</div>
  <div class="row"><b id="dept">Outerwear</b><span id="coll">Slate &amp; Ember</span></div>
  <div id="speedbar"><div id="speed"></div></div>
</div>
<div class="hud fall-only" id="hint">
  <kbd>Scroll</kbd> to fall &nbsp;·&nbsp; <kbd>Drag</kbd> to turn<br>
  <kbd>F</kbd> look up / down &nbsp;·&nbsp; <kbd>Click</kbd> any window
</div>
<div id="tag"></div>

<button class="chip" id="p-close">← Back to the atrium</button>
<aside id="panel" aria-label="Product">
  <div id="p-dept"></div>
  <h2 id="p-name"></h2>
  <div id="p-price"></div>
  <p id="p-desc"></p>
  <div class="lbl"><span>Colour</span></div>
  <div id="p-sw"></div>
  <div class="lbl"><span>Size</span><span id="p-fit"></span></div>
  <div id="p-size"></div>
  <div class="acts">
    <button id="p-try">Try it on the model</button>
    <button id="p-spin">Turntable</button>
    <button id="p-detail">Fabric close-up</button>
    <button id="p-add">Add to bag</button>
  </div>
  <div class="lbl" style="margin-top:16px"><span id="p-id"></span></div>
</aside>
<div id="studio-hint">Drag to turn · scroll to zoom into the weave · Esc to go back</div>

</body>
</html>
